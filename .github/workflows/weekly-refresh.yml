name: Weekly refresh

# Every Sunday at 6 AM New York time (11:00 UTC; 7 AM in summer), refresh the
# places, events and roundup, and open a pull request for Katie to merge.
# Nothing goes live until that pull request is merged.
on:
  schedule:
    - cron: '0 11 * * 0'
  workflow_dispatch:
  # A push to the setup branch runs a test without opening a pull request.
  push:
    branches: [weekly-refresh]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyarrow
      - name: Refresh places, events and roundup
        if: github.event_name != 'push'
        run: SUMMARY=/tmp/summary.md bash tools/refresh/run.sh
      - name: Probe event sources (setup test only)
        if: github.event_name == 'push'
        run: |
          echo "https://www.nycgovparks.org/events https://www.boweryballroom.com/ https://www.mercuryloungenyc.com/ https://rockwoodmusichall.com/ https://www.tenement.org/ https://donyc.com/venues/bowery-ballroom https://www.theskint.com/feed/ https://www.newmuseum.org/ https://metrograph.com/" | python3 tools/refresh/probe_events.py
          python3 tools/refresh/events.py /tmp/events.json
      - name: Open the pull request
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data; then echo "Nothing changed this week."; exit 0; fi
          day=$(TZ=America/New_York date +%Y-%m-%d)
          branch="refresh/$day"
          git config user.name "Rivington Robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data
          git commit -m "Weekly refresh for $day"
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Weekly refresh: $(TZ=America/New_York date '+%b %-d')" \
            --body-file /tmp/summary.md
