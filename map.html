<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Map · Rivington Robot</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

<div class="container">

  <nav class="nav">
    <div class="nav-brand">
      <div class="nav-logo">🤖</div>
      <div class="nav-title">Paul & Tina's Rivington Robot</div>
    </div>
    <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')">☰</button>
    <div class="nav-links">
      <a href="index.html">HOME</a>
      <a href="map.html" class="active">FULL MAP</a>
      <a href="roundup.html">ROUNDUP</a>
      <a href="essentials.html">ESSENTIALS</a>
    </div>
  </nav>

  <section>
    <div class="section-head">
      <div class="section-bar green"></div>
      <h2>Full map &amp; list</h2>
      <span class="sub" id="map-count">loading places…</span>
    </div>

    <div class="map-filters" id="map-filters"></div>
    <label class="show-all"><input type="checkbox" id="show-all"> Show everything, including less certain listings</label>

    <div id="map-full"></div>

    <p style="font-size: 12px; color: var(--ink-3); margin-top: 16px;">Tap a chip to hide or show a kind of place. Tap any dot for details and walking directions. Big dots are robot picks.</p>
  </section>

  <section id="list">
    <div class="section-head">
      <div class="section-bar green"></div>
      <h2>The list</h2>
      <span class="sub" id="list-count"></span>
    </div>
    <input type="search" id="place-search" class="place-search" placeholder="Search: tacos, yoga, laundromat, vintage…" autocomplete="off">
    <div id="place-list" class="place-list"></div>
    <button id="place-more" class="place-more" style="display:none">Show more</button>
  </section>

  <footer class="footer">
    <div class="footer-gradient"></div>
    Made with care for Paul &amp; Tina · 8 Rivington St
  </footer>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/robot.js"></script>
<script>
const list = Robot.initList({ listId: 'place-list', searchId: 'place-search', moreId: 'place-more', countId: 'list-count' });
Robot.initMap({ mapId: 'map-full', chipsId: 'map-filters', countId: 'map-count', showAllId: 'show-all', scrollZoom: true,
  onReady: (d, on, showAll) => list.ready(d, on, showAll), onFilter: (on, showAll) => list.filter(on, showAll) });
</script>

</body>
</html>
